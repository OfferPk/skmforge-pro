<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#1f2e48"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#2979ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#ffffff">SKMForge Pro — System Architecture</text>
  <text x="40" y="70" font-family="JetBrains Mono, monospace" font-size="12" fill="#00e5ff">CCSDS 354.0-M-1 SYMMETRIC KEY MANAGEMENT ARCHITECTURE</text>

  <!-- Ground Segment / Key Management Facility -->
  <rect x="40" y="100" width="280" height="460" rx="8" fill="url(#cardGrad)" stroke="#243552" stroke-width="1.5" />
  <rect x="40" y="100" width="280" height="35" rx="8" fill="#152033" />
  <text x="55" y="123" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1. Ground Key Facility (KMF)</text>

  <rect x="60" y="150" width="240" height="80" rx="6" fill="#0d1424" stroke="#2979ff" stroke-width="1" />
  <text x="75" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2979ff">Root Key Generation Engine</text>
  <text x="75" y="195" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• FIPS 140-3 Hardware RNG</text>
  <text x="75" y="212" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Master KEK Provisioning</text>

  <rect x="60" y="250" width="240" height="100" rx="6" fill="#0d1424" stroke="#00e5ff" stroke-width="1" />
  <text x="75" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e5ff">OTAR Packaging Gateway (§4.3)</text>
  <text x="75" y="295" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Session Key Wrap (AES-KW)</text>
  <text x="75" y="312" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• 128-bit Integrity Tag (GMAC)</text>
  <text x="75" y="329" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Replay Sequence Counters</text>

  <rect x="60" y="370" width="240" height="80" rx="6" fill="#0d1424" stroke="#64748b" stroke-width="1" />
  <text x="75" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Ground Mission Vault</text>
  <text x="75" y="415" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• 5-State Key State Store</text>
  <text x="75" y="432" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Legacy Playback Archive</text>

  <!-- Uplink Stream -->
  <path d="M 320 300 L 410 300" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6,4" />
  <polygon points="410,295 420,300 410,305" fill="#00e5ff" />
  <text x="330" y="290" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e5ff">OTAR PDU</text>

  <!-- Space Segment / Onboard Security Module -->
  <rect x="420" y="100" width="540" height="460" rx="8" fill="url(#cardGrad)" stroke="#243552" stroke-width="1.5" />
  <rect x="420" y="100" width="540" height="35" rx="8" fill="#152033" />
  <text x="440" y="123" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2. Spacecraft Cryptographic Module (SCM)</text>

  <!-- Master Key Partition -->
  <rect x="445" y="150" width="240" height="170" rx="6" fill="#0d1424" stroke="#2979ff" stroke-width="1.5" />
  <text x="460" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#2979ff">Master Key Storage (Tier 0)</text>
  <text x="460" y="195" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">Single Purpose Mandate (§3.1.2.2):</text>
  <text x="460" y="215" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e5ff">• MK-OTAR: Key Encryption Key</text>
  <text x="460" y="232" font-family="JetBrains Mono, monospace" font-size="10" fill="#ffab00">• MK-CMD: Hardware Auth Key</text>
  <text x="460" y="249" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff1744">• MK-REC: Emergency Recovery</text>
  <text x="460" y="275" font-family="JetBrains Mono, monospace" font-size="9" fill="#64748b">PROHIBITED: Direct Traffic Encryption</text>

  <!-- Session Key Partition -->
  <rect x="705" y="150" width="235" height="170" rx="6" fill="#0d1424" stroke="#00e676" stroke-width="1.5" />
  <text x="720" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e676">Session Key Storage (Tier 1..N)</text>
  <text x="720" y="195" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">Active Traffic Roles (§3.1.3):</text>
  <text x="720" y="215" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• SK-TM: Telemetry AEAD (GCM)</text>
  <text x="720" y="232" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• SK-TC: Command Auth (CMAC)</text>
  <text x="720" y="249" font-family="JetBrains Mono, monospace" font-size="10" fill="#cbd5e1">• SK-PL: Payload Bulk Encrypt</text>
  <text x="720" y="275" font-family="JetBrains Mono, monospace" font-size="9" fill="#00e676">Isolated Single Purpose Bound</text>

  <!-- 5-State Lifecycle Engine -->
  <rect x="445" y="340" width="495" height="190" rx="6" fill="#0b111e" stroke="#00e5ff" stroke-width="1" />
  <text x="465" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#00e5ff">3. Deterministic 5-State Key Lifecycle State Machine (§3.2)</text>

  <!-- State nodes -->
  <g transform="translate(465, 385)">
    <!-- PRE_ACTIVATION -->
    <rect x="0" y="10" width="85" height="40" rx="4" fill="#1e293b" stroke="#475569" />
    <text x="42" y="34" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#cbd5e1" text-anchor="middle">PRE-ACT</text>

    <!-- ACTIVE -->
    <rect x="100" y="10" width="85" height="40" rx="4" fill="#064e3b" stroke="#00e676" />
    <text x="142" y="34" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#00e676" text-anchor="middle">ACTIVE</text>

    <!-- SUSPENDED -->
    <rect x="200" y="10" width="85" height="40" rx="4" fill="#451a03" stroke="#ffab00" />
    <text x="242" y="34" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#ffab00" text-anchor="middle">SUSPENDED</text>

    <!-- DEACTIVATED -->
    <rect x="300" y="10" width="85" height="40" rx="4" fill="#1e293b" stroke="#64748b" />
    <text x="342" y="34" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#cbd5e1" text-anchor="middle">DEACTIVATED</text>

    <!-- DESTROYED -->
    <rect x="400" y="10" width="75" height="40" rx="4" fill="#4c0519" stroke="#ff1744" />
    <text x="437" y="34" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#ff1744" text-anchor="middle">DESTROYED</text>

    <!-- Arrows -->
    <path d="M 85 30 L 100 30" stroke="#00e676" stroke-width="1.5" />
    <path d="M 185 25 L 200 25" stroke="#ffab00" stroke-width="1.5" />
    <path d="M 200 35 L 185 35" stroke="#00e676" stroke-width="1.5" />
    <path d="M 285 30 L 300 30" stroke="#64748b" stroke-width="1.5" />
    <path d="M 385 30 L 400 30" stroke="#ff1744" stroke-width="1.5" />

    <!-- Explanatory captions below states -->
    <text x="0" y="75" font-family="JetBrains Mono, monospace" font-size="8" fill="#94a3b8">• Zero Crypto Ops Allowed</text>
    <text x="0" y="90" font-family="JetBrains Mono, monospace" font-size="8" fill="#94a3b8">• Awaiting Epoch Trigger</text>

    <text x="140" y="75" font-family="JetBrains Mono, monospace" font-size="8" fill="#00e676">• Full Operation Permitted</text>
    <text x="140" y="90" font-family="JetBrains Mono, monospace" font-size="8" fill="#00e676">• Frame Counter Guarded</text>

    <text x="290" y="75" font-family="JetBrains Mono, monospace" font-size="8" fill="#cbd5e1">• Read-Only Decrypt Only</text>
    <text x="290" y="90" font-family="JetBrains Mono, monospace" font-size="8" fill="#cbd5e1">• Protect New Data: FORBIDDEN</text>

    <text x="400" y="75" font-family="JetBrains Mono, monospace" font-size="8" fill="#ff1744">• Zero Overwrite</text>
    <text x="400" y="90" font-family="JetBrains Mono, monospace" font-size="8" fill="#ff1744">• Terminal State</text>
  </g>
</svg>
